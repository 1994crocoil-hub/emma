<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>景點管理｜京都・大阪旅行手帳</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script defer src="places.js?v=5"></script>
  <script type="module" src="admin.js?v=6"></script>
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="./"><span class="brand-icon" aria-hidden="true">✽</span>京都・大阪旅行手帳</a>
    <a class="text-link" href="./#saved">回旅行手帳</a>
  </div></header>
  <main class="wrap admin-page">
    <div class="section-heading"><h1>景點管理</h1><p>更新資料、預覽草稿和查核官方公告。</p></div>
    <p id="editor-status" role="status">正在確認登入狀態。</p>
    <a class="button primary" id="admin-signin" href="./#cloud-sync" hidden>前往登入</a>
    <div class="admin-shell" hidden>
      <aside class="admin-list-panel">
        <button type="button" id="editor-new" class="button primary">新增景點</button>
        <label>搜尋景點<input id="editor-search" type="search"></label>
        <div class="shops-controls" role="group" aria-label="顯示範圍">
          <button type="button" class="button small" data-editor-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="button small" data-editor-filter="review" aria-pressed="false">待查核</button>
          <button type="button" class="button small" data-editor-filter="suggestions" aria-pressed="false">訪客投稿</button>
        </div>
        <p id="editor-count" role="status"></p>
        <div id="editor-list"></div>
      </aside>
      <div class="admin-work">
        <section id="submission-queue" class="editor-panel" hidden aria-labelledby="submission-queue-title">
          <h2 id="submission-queue-title">訪客投稿</h2>
          <p id="submission-status" role="status"></p>
          <button id="submission-reload" class="button small" type="button">重新整理</button>
          <div id="submission-list"></div>
        </section>
        <div id="editor-draft" class="admin-work">
        <form id="editor-form">
          <fieldset id="editor-fields">
            <legend id="editor-title">景點內容</legend>
            <div id="editor-suggestion-context" hidden></div>
            <div class="editor-fields">
              <label>中文名<input name="name" maxlength="160"></label>
              <label>日文名<input name="japanese" maxlength="160"></label>
              <label>搜尋別名<input name="aliases" placeholder="例如：Fushimi、千本鳥居" maxlength="200"></label>
              <label>地圖搜尋名稱<input name="map" maxlength="160"></label>
              <label>城市<select name="city"><option>京都</option><option>大阪</option></select></label>
              <label>分類<select name="category"><option>景點</option><option>美食</option><option>購物</option><option>室內</option><option>角色商店</option></select></label>
              <label>建議安排<select name="day"><option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option></select></label>
              <label>最近車站<input name="station" maxlength="160"></label>
              <label class="editor-wide">日文地址<input name="address" maxlength="250"></label>
              <label class="editor-wide">出口或步行提示<textarea name="access" rows="2" maxlength="400"></textarea></label>
              <label class="editor-wide">預約／參觀方式<textarea name="booking" rows="2" maxlength="400"></textarea></label>
              <label class="editor-wide">官方來源<input name="source" type="url" placeholder="https://"></label>
              <label class="editor-wide">入場公告網址<input name="notice" type="url" placeholder="https://"></label>
              <label>地圖緯度<input name="lat" type="number" step="any" min="-90" max="90"></label>
              <label>地圖經度<input name="lng" type="number" step="any" min="-180" max="180"></label>
              <label>最後查核日期<input name="checked_at" type="date"></label>
            </div>
            <div class="editor-actions">
              <button class="button small" type="submit" value="save">儲存草稿</button>
              <button class="button primary" type="submit" value="publish">發布景點</button>
              <button class="button small" type="button" id="editor-review">標記已查核</button>
              <button class="button small" type="button" id="editor-archive">下架</button>
              <a class="text-link" id="editor-source" target="_blank" rel="noopener" hidden>查看官方來源</a>
            </div>
          </fieldset>
        </form>
        <section class="editor-panel"><h2>景點卡預覽</h2><article class="catalog-card" id="editor-preview"></article></section>
        <section class="editor-panel"><h2>異動紀錄</h2><ol id="editor-log"></ol></section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
